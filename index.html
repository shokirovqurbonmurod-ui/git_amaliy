<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 60px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:80px 60px;
    }

    .hero-text{
      max-width:500px;
    }

    .hero-text h1{
      font-size:55px;
      margin-bottom:20px;
    }

    .hero-text p{
      color:#cbd5e1;
      margin-bottom:20px;
      line-height:1.6;
    }

    button{
      padding:14px 28px;
      border:none;
      background:#2563eb;
      color:white;
      border-radius:8px;
      cursor:pointer;
      margin-right:10px;
    }

    img{
      width:420px;
    }

    .logos{
      display:flex;
      justify-content:center;
      gap:30px;
      padding:40px;
      color:#94a3b8;
      font-size:22px;
    }

  </style>

</head>
<body>

<header>

  <h2>AI.</h2>

  <nav>
    <a href="">Home</a>
    <a href="">About</a>
    <a href="">Services</a>
    <a href="">Contact</a>
  </nav>

</header>

<section class="hero">

  <div class="hero-text">

    <h1>
      Artificial Intelligence &
      Cyber Security
    </h1>

    <p>
      Protect and prevent threats
      with modern technologies.
    </p>

    <button>Get Started</button>
    <button>Watch Video</button>

  </div>

  <div>

    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">

  </div>

</section>

<div class="logos">
  <span>Logoipsum</span>
  <span>Logo</span>
  <span>Logotipsum</span>
  <span>Logoipsum</span>
</div>

</body>
</html>
